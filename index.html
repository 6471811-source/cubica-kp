#splash{position:fixed;inset:0;z-index:9999;background:#f8f6f2;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .8s ease,visibility .8s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .logo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f8f6f2}
#splash .logo-wrap svg{display:block;width:100%;height:100%;transform-origin:center center;transform:translateX(8vw);opacity:0}
#splash .logo-wrap svg.play{opacity:1;animation:zoomOut 4s cubic-bezier(.1,.9,.35,1) forwards}
@keyframes zoomOut{0%{transform:translateX(8vw) scale(5)}100%{transform:translateX(8vw) scale(1)}}
#splash .sign-anim .st0,#splash .sign-anim .st1 polygon,#splash .sign-anim .st2 polygon{transform-box:fill-box;transform-origin:center}
@keyframes flyFromTopRight{0%{transform:translate(900px,-900px);opacity:0}5%{opacity:1}100%{transform:translate(0,0);opacity:1}}
@keyframes flyFromBottomLeft{0%{transform:translate(-900px,900px);opacity:0}5%{opacity:1}100%{transform:translate(0,0);opacity:1}}
#splash .logo-wrap svg.play .sign-anim .tr{animation:flyFromTopRight 3.5s cubic-bezier(.1,.9,.35,1) both}
#splash .logo-wrap svg.play .sign-anim .bl{animation:flyFromBottomLeft 3.5s cubic-bezier(.1,.9,.35,1) both}

#splash .logo-wrap svg.play .sign-anim .d5{animation-delay:.25s}
#splash .logo-wrap svg.play .sign-anim .d6{animation-delay:.3s}
#splash .logo-wrap svg.play .sign-anim .d7{animation-delay:.35s}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f8f6f2;color:#2c3e50;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.kp-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#f8f6f2}
.kp-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 10%,rgba(196,154,108,.10) 0%,transparent 60%),radial-gradient(ellipse at 90% 90%,rgba(44,62,80,.06) 0%,transparent 60%)}
.kp-bg-rail{position:absolute;height:2px;background:linear-gradient(90deg,transparent 0%,rgba(230,180,120,.75) 30%,rgba(230,180,120,.95) 50%,rgba(230,180,120,.75) 70%,transparent 100%);opacity:.7;border-radius:2px;box-shadow:0 0 12px rgba(196,154,108,.5);transform-origin:center center;will-change:transform;animation:kpRailFlowDiag 14s linear infinite}
@keyframes kpRailFlowDiag{0%{transform:translate(-150%,-150%) rotate(-25deg);opacity:0}10%{opacity:.75}90%{opacity:.75}100%{transform:translate(150%,150%) rotate(-25deg);opacity:0}}
.kp-bg-rail.s1{top:10%;width:45%;left:5%;animation-delay:0s;opacity:.9}
.kp-bg-rail.s2{top:25%;width:60%;left:15%;animation-delay:-2s;opacity:.55}
.kp-bg-rail.s3{top:40%;width:40%;left:35%;animation-delay:-4s;opacity:.85}
.kp-bg-rail.s4{top:55%;width:55%;left:20%;animation-delay:-6s;opacity:.6}
.kp-bg-rail.s5{top:70%;width:50%;left:40%;animation-delay:-8s;opacity:.75}
.kp-bg-rail.s6{top:85%;width:35%;left:10%;animation-delay:-10s;opacity:.5}
.kp-bg-rail.s7{top:18%;width:42%;left:55%;animation-delay:-1s;opacity:.6}
.kp-bg-rail.s8{top:65%;width:38%;left:60%;animation-delay:-7s;opacity:.7}
.kp-wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:60px 24px 80px}
.kp-hero{text-align:center;padding:20px 0 40px}
.kp-logo-svg{display:block;width:360px;max-width:90%;margin:0 auto 16px auto;padding:0;text-align:center}
.kp-logo-svg svg{width:100%;height:auto;display:block;margin:0 auto}
.kp-h1{font-family:'Playfair Display',serif;font-size:48px;font-weight:600;color:#2c3e50;margin:0 0 12px;opacity:0;animation:kpSlideUp .8s .8s ease-out forwards;line-height:1.15}
.kp-h2{font-size:14px;color:#7a8a99;font-weight:500;margin:0;letter-spacing:2.5px;text-transform:uppercase;opacity:0;animation:kpSlideUp .8s 1s ease-out forwards}
.kp-client{margin-top:24px;font-size:15px;color:#c49a6c;opacity:0;animation:kpSlideUp .8s 1.2s ease-out forwards;font-weight:500}
@keyframes kpSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.kp-section{margin:32px 0;padding:32px 36px;background:#fff;border:1px solid rgba(196,154,108,.15);border-radius:16px;box-shadow:0 10px 40px rgba(44,62,80,.04);opacity:0;transform:translateY(40px);transition:opacity .7s ease,transform .7s ease,box-shadow .3s ease}
.kp-section.visible{opacity:1;transform:translateY(0)}
.kp-sec-title{display:flex;align-items:center;gap:14px;font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#2c3e50;margin:0 0 24px}
.kp-sec-num{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#2c3e50;color:#fff;font-size:15px;font-weight:600;flex-shrink:0;font-family:'Inter',sans-serif}
.kp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kp-stat{background:#fdfcfb;border:1px solid rgba(196,154,108,.2);border-radius:12px;padding:20px 16px;text-align:center}
.kp-stat-lb{font-size:11px;color:#7a8a99;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;font-weight:600}
.kp-stat-vl{font-size:28px;font-weight:700;color:#c49a6c;font-variant-numeric:tabular-nums;line-height:1}
.kp-stat-vl small{font-size:14px;color:#7a8a99;font-weight:500;margin-left:2px}
.kp-table{width:100%;border-collapse:collapse;font-size:14px}
.kp-table th{text-align:left;padding:14px 16px;font-size:11px;color:#7a8a99;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(196,154,108,.2);font-weight:600}
.kp-table td{padding:14px 16px;border-bottom:1px solid rgba(196,154,108,.1);color:#2c3e50}
.kp-table tr:last-child td{border-bottom:none}
.kp-table td.qty{text-align:right;font-weight:700;color:#c49a6c;font-variant-numeric:tabular-nums;white-space:nowrap}
.kp-scheme-2d{background:#fdfcfb;border-radius:12px;padding:16px;overflow:hidden;border:1px solid rgba(196,154,108,.15)}
.kp-scheme-2d svg{width:100%;height:auto;display:block;border-radius:8px}
.kp-3d{width:100%;aspect-ratio:16/9;background:#f0ece6;border-radius:12px;overflow:hidden;position:relative;border:1px solid rgba(196,154,108,.2)}
.kp-3d canvas{display:block;width:100%;height:100%}
.kp-3d-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c49a6c;font-size:14px;text-align:center;padding:20px;font-family:'Inter',sans-serif}
.kp-total{text-align:center;padding:40px 24px;background:linear-gradient(135deg,rgba(196,154,108,.08),rgba(196,154,108,.03));border:2px solid rgba(196,154,108,.3);border-radius:20px;margin:32px 0}
.kp-total-lb{font-size:12px;color:#7a8a99;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
.kp-total-vl{font-family:'Playfair Display',serif;font-size:56px;font-weight:700;color:#c49a6c;line-height:1;font-variant-numeric:tabular-nums}
.kp-total-vl small{font-size:22px;color:#7a8a99;margin-left:6px;font-family:'Inter',sans-serif;font-weight:500}
.kp-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:32px 0}
.kp-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;font-size:15px;font-weight:600;border-radius:12px;cursor:pointer;border:none;font-family:'Inter',sans-serif;text-decoration:none;transition:transform .2s,box-shadow .2s}
.kp-btn:hover{transform:translateY(-2px)}
.kp-btn.secondary{background:#fff;color:#2c3e50;border:1px solid rgba(196,154,108,.4);box-shadow:0 4px 12px rgba(44,62,80,.04)}
.kp-btn.danger{background:linear-gradient(135deg,#c49a6c,#a87c4f);color:#fff;box-shadow:0 8px 24px rgba(196,154,108,.25)}
.kp-btn.montage{background:#fff;color:#2c3e50;border:1px solid rgba(44,62,80,.2);box-shadow:0 4px 12px rgba(44,62,80,.04)}
.kp-contacts{text-align:center;font-size:13px;color:#7a8a99;margin:16px 0 8px;line-height:1.7}
.kp-contacts a{color:#c49a6c;text-decoration:none;font-weight:600}
.kp-montage-note{text-align:center;font-size:12.5px;color:#7a8a99;margin:8px auto 0;max-width:520px;line-height:1.6;padding:12px 16px;background:rgba(196,154,108,.06);border:1px dashed rgba(196,154,108,.35);border-radius:10px}
.kp-montage-note b{color:#2c3e50}
.kp-foot{text-align:center;font-size:12px;color:#9aa8b5;padding-top:40px;margin-top:40px;border-top:1px solid rgba(196,154,108,.15)}
.kp-valid{display:inline-block;padding:8px 18px;background:rgba(196,154,108,.1);border:1px solid rgba(196,154,108,.3);border-radius:20px;color:#c49a6c;font-size:12px;font-weight:600;margin:8px 0}
.kp-empty{text-align:center;padding:80px 20px;color:#9aa8b5}
.kp-empty h2{color:#c49a6c;margin-bottom:12px;font-family:'Playfair Display',serif}
@media(max-width:640px){.kp-h1{font-size:32px}.kp-total-vl{font-size:42px}.kp-section{padding:24px 20px}.kp-wrap{padding:36px 16px 60px}.kp-stat-vl{font-size:22px}.kp-logo-svg{width:280px}}

function b64dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function polyArea(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
function pointInPoly(poly,px,py){let inside=false,n=poly.length;for(let i=0,j=n-1;i<n;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];const inter=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);if(inter)inside=!inside;}return inside;}
function clipSegToPoly(poly,x1,y1,x2,y2){const n=poly.length;const dx=x2-x1,dy=y2-y1;const ts=[0,1];for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];const ex=b[0]-a[0],ey=b[1]-a[1];const denom=dx*ey-dy*ex;if(Math.abs(denom)<1e-9)continue;const t=((a[0]-x1)*ey-(a[1]-y1)*ex)/denom;if(t>1e-6&&t<1-1e-6)ts.push(t);}ts.sort((p,q)=>p-q);const uniq=[ts[0]];for(let i=1;i<ts.length;i++)if(ts[i]-uniq[uniq.length-1]>1e-6)uniq.push(ts[i]);const out=[];for(let i=0;i<uniq.length-1;i++){const t0=uniq[i],t1=uniq[i+1];if(t1-t0<1e-6)continue;const tm=(t0+t1)/2;const mx=x1+tm*dx,my=y1+tm*dy;if(pointInPoly(poly,mx,my))out.push([x1+t0*dx,y1+t0*dy,x1+t1*dx,y1+t1*dy]);}return out;}
function clipSegToRect(x0,y0,x1,y1,rx0,ry0,rx1,ry1){let t0=0,t1=1;const dx=x1-x0,dy=y1-y0;const p=[-dx,dx,-dy,dy];const q=[x0-rx0,rx1-x0,y0-ry0,ry1-y0];for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-9){if(q[i]<0)return null;}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return null;if(t>t0)t0=t;}else{if(t<t0)return null;if(t<t1)t1=t;}}}return[x0+t0*dx,y0+t0*dy,x0+t1*dx,y0+t1*dy];}
function mergeCollinearSegments(segs){if(!segs||segs.length<=1)return segs||[];let refIdx=0,refLen=0;for(let i=0;i<segs.length;i++){const L=Math.hypot(segs[i][2]-segs[i][0],segs[i][3]-segs[i][1]);if(L>refLen){refLen=L;refIdx=i;}}if(refLen<1e-6)return segs;const rdx=segs[refIdx][2]-segs[refIdx][0],rdy=segs[refIdx][3]-segs[refIdx][1];const ux=rdx/refLen,uy=rdy/refLen,px=-uy,py=ux;const items=segs.map(s=>{const t0=s[0]*ux+s[1]*uy,t1=s[2]*ux+s[3]*uy;const d0=s[0]*px+s[1]*py,d1=s[2]*px+s[3]*py;return{tMin:Math.min(t0,t1),tMax:Math.max(t0,t1),dPerp:(d0+d1)/2};});items.sort((a,b)=>a.tMin-b.tMin);const merged=[];let cur=items[0];for(let i=1;i<items.length;i++){const next=items[i];const cL=cur.tMax-cur.tMin,nL=next.tMax-next.tMin,tot=cL+nL;const avg=tot>0?(cur.dPerp*cL+next.dPerp*nL)/tot:cur.dPerp;if(Math.abs(next.dPerp-cur.dPerp)<2&&next.tMin<=cur.tMax+2){cur={tMin:Math.min(cur.tMin,next.tMin),tMax:Math.max(cur.tMax,next.tMax),dPerp:avg};}else{merged.push(cur);cur=next;}}merged.push(cur);return merged.map(m=>[m.tMin*ux+m.dPerp*px,m.tMin*uy+m.dPerp*py,m.tMax*ux+m.dPerp*px,m.tMax*uy+m.dPerp*py]);}
function computeWallAlignedPositions(total,edgeDist,maxStep){if(total<=0)return[];if(total<=2*edgeDist)return[total/3,2*total/3];const span=total-2*edgeDist;const nGaps=Math.max(1,Math.ceil(span/maxStep));const step=span/nGaps;const positions=[];for(let i=0;i<=nGaps;i++)positions.push(edgeDist+i*step);return positions;}

function makeWoodCanvas(base,dark,opts){opts=opts||{};const W=256,H=256;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');const gd=opts.grainDensity||170,gc=opts.grainContrast||1,wa=opts.warpAmp||3,lb=opts.lightnessBands||70;const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,base);g.addColorStop(1,dark);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<gd;i++){const x=Math.random()*W;ctx.strokeStyle='rgba(0,0,0,'+((0.04+Math.random()*0.09)*gc)+')';ctx.lineWidth=0.4+Math.random()*1.3;ctx.beginPath();let y=0,xx=x;ctx.moveTo(xx,y);while(y<H){y+=6+Math.random()*10;xx+=(Math.random()-0.5)*wa;ctx.lineTo(xx,y);}ctx.stroke();}for(let j=0;j<lb;j++){const x2=Math.random()*W;ctx.strokeStyle='rgba(255,255,255,'+((0.02+Math.random()*0.05)*gc)+')';ctx.lineWidth=0.3+Math.random()*1.1;ctx.beginPath();let y2=0,xx2=x2;ctx.moveTo(xx2,y2);while(y2<H){y2+=8+Math.random()*12;xx2+=(Math.random()-0.5)*(wa*0.66);ctx.lineTo(xx2,y2);}ctx.stroke();}return c;}

function recalcLayout(kp){
const{railW,railH,gap}=kp.p;
const L=kp.L_in,W=kp.W_in;
const polygon=kp.polygon?kp.polygon.map(p=>[p[0],p[1]]):null;
const rotationDeg=kp.r||0;const rotRad=rotationDeg*Math.PI/180;const cosR=Math.cos(rotRad),sinR=Math.sin(rotRad);const absC=Math.abs(cosR),absS=Math.abs(sinR);
const pitch=railW+gap;const roomCx=L/2,roomCy=W/2;
function gridToWorld(gx,gy){return[roomCx+gx*cosR-gy*sinR,roomCy+gx*sinR+gy*cosR];}
function worldToGrid(wx,wy){const dx=wx-roomCx,dy=wy-roomCy;return[dx*cosR+dy*sinR,-dx*sinR+dy*cosR];}
function clipAny(x0,y0,x1,y1){if(polygon)return clipSegToPoly(polygon,x0,y0,x1,y1);const c=clipSegToRect(x0,y0,x1,y1,0,0,L,W);return c?[c]:[];}
const gridXExtent=L*absC+W*absS;const gridYExtent=L*absS+W*absC;const gxHalf=gridXExtent/2+pitch*2;const gyHalf=gridYExtent/2+pitch*2;
const perRailSegments=[];
let nRailsLines=Math.max(1,Math.floor((gridYExtent+gap)/pitch));if(nRailsLines>MAX_RAILS)nRailsLines=MAX_RAILS;
const totalRailsSpan=nRailsLines*railW+(nRailsLines-1)*gap;const railEdgeOffset=(gridYExtent-totalRailsSpan)/2;
for(let i=0;i<nRailsLines;i++){
const gy=-gridYExtent/2+railEdgeOffset+railW/2+i*pitch;const[wx0,wy0]=gridToWorld(-gxHalf,gy);const[wx1,wy1]=gridToWorld(+gxHalf,gy);
const mergedSegs=mergeCollinearSegments(clipAny(wx0,wy0,wx1,wy1));
for(const c of mergedSegs){const dxs=c[2]-c[0],dys=c[3]-c[1];const len=Math.hypot(dxs,dys);if(len<50)continue;const ux=dxs/len,uy=dys/len;const pat=computeRailSegments(len);perRailSegments.push({x0:c[0],y0:c[1],x1:c[2],y1:c[3],len,ux,uy,pieces:pat.pieces});}
}
const gxMinAll=-gridXExtent/2+STRINGER_WALL_EDGE;const gxMaxAll=+gridXExtent/2-STRINGER_WALL_EDGE;
let stringerXsGrid=computeWallAlignedPositions(gridXExtent,STRINGER_WALL_EDGE,CARRIER_STEP_MAX).map(p=>p-gridXExtent/2);
const railGridRanges=perRailSegments.map(r=>{const gx0=worldToGrid(r.x0,r.y0)[0];const gx1=worldToGrid(r.x1,r.y1)[0];return{len:r.len,min:Math.min(gx0,gx1),max:Math.max(gx0,gx1)};});

function passEnsureEndSupport(){let changed=false;const xSet=new Set(stringerXsGrid);for(const r of railGridRanges){if(r.len<200)continue;const inside=[...xSet].filter(x=>x>=r.min-30&&x<=r.max+30).sort((a,b)=>a-b);if(inside.length===0)continue;const first=inside[0],last=inside[inside.length-1];if(first-r.min>RAIL_END_OVERHANG_MAX){const target=r.min+Math.max(100,RAIL_END_OVERHANG_MAX-50);if(addStringerToSet(xSet,target))changed=true;}if(r.max-last>RAIL_END_OVERHANG_MAX){const target=r.max-Math.max(100,RAIL_END_OVERHANG_MAX-50);if(addStringerToSet(xSet,target))changed=true;}}stringerXsGrid=[...xSet].sort((a,b)=>a-b);return changed;}

for(let k=0;k<pieces.length;k++){const t0=starts[k]/len,t1=(starts[k]+pieces[k])/len;const sh=((j+k)%2)*CARRIER_XSHIFT;const ax=c[0]+dxs*t0+cosR*sh,ay=c[1]+dys*t0+sinR*sh;const bx=c[0]+dxs*t1+cosR*sh,by=c[1]+dys*t1+sinR*sh;const mergedSub=mergeCollinearSegments(clipAny(ax,ay,bx,by));
for(const sc of mergedSub){const slen=Math.hypot(sc[2]-sc[0],sc[3]-sc[1]);if(slen<50)continue;const sux=(sc[2]-sc[0])/slen,suy=(sc[3]-sc[1])/slen;strSegList.push({x0:sc[0],y0:sc[1],x1:sc[2],y1:sc[3],len:slen,ux:sux,uy:suy,xShift:sh});

if(gyRange>50){const gyList=computeWallAlignedPositions(gyRange,HANGER_WALL_EDGE,HANGER_STEP_MAX);for(const gy of gyList){const gxHanger=gx+sh;const wpt=gridToWorld(gxHanger,gyMin+gy);let inside=true;if(polygon)inside=pointInPoly(polygon,wpt[0],wpt[1]);else inside=wpt[0]>=0&&wpt[0]<=L&&wpt[1]>=0&&wpt[1]<=W;if(!inside)continue;hangers.push({x:wpt[0],y:wpt[1]});}}}}
}
perStringerSegments.push({x:gx,origX:gx,segs:strSegList,hangers});
}
return{L_in:L,W_in:W,railW,railH,gap,pitch,rotationDeg,perRailSegments,perStringerSegments,polygon};
}

function kpBuild2DScheme(kp,layout){
const{L_in,W_in,polygon}=layout;
const width=800,height=520,padding=60;
const s=Math.min((width-2*padding)/L_in,(height-2*padding)/W_in);
const dw=L_in*s,dh=W_in*s;
const ox=(width-dw)/2,oy=(height-dh)/2;
let svg='<svg viewBox="0 0 '+width+' '+height+'" xmlns="http://www.w3.org/2000/svg" style="background:#fdfcfb;border-radius:8px">';
svg+='<defs><clipPath id="kp-clip">';
if(polygon){svg+='<polygon points="'+polygon.map(p=>(ox+p[0]*s).toFixed(2)+','+(oy+p[1]*s).toFixed(2)).join(' ')+'"/>';}
else{svg+='<rect x="'+ox+'" y="'+oy+'" width="'+dw+'" height="'+dh+'"/>';}
svg+='</clipPath></defs>';
svg+='<g clip-path="url(#kp-clip)">';
for(const rseg of layout.perRailSegments){const sx0=ox+rseg.x0*s,sy0=oy+rseg.y0*s;const sx1=ox+rseg.x1*s,sy1=oy+rseg.y1*s;svg+='<line x1="'+sx0.toFixed(2)+'" y1="'+sy0.toFixed(2)+'" x2="'+sx1.toFixed(2)+'" y2="'+sy1.toFixed(2)+'" stroke="#c49a6c" stroke-width="'+Math.max(2,layout.railW*s*0.9).toFixed(2)+'" stroke-linecap="butt"/>';}
for(const sseg of layout.perStringerSegments){for(const sg of sseg.segs){const sx0=ox+sg.x0*s,sy0=oy+sg.y0*s;const sx1=ox+sg.x1*s,sy1=oy+sg.y1*s;svg+='<line x1="'+sx0.toFixed(2)+'" y1="'+sy0.toFixed(2)+'" x2="'+sx1.toFixed(2)+'" y2="'+sy1.toFixed(2)+'" stroke="#8fa0b8" stroke-width="2" stroke-linecap="round"/>';}}
svg+='</g>';
if(polygon){svg+='<polygon points="'+polygon.map(p=>(ox+p[0]*s).toFixed(2)+','+(oy+p[1]*s).toFixed(2)).join(' ')+'" fill="none" stroke="#c49a6c" stroke-width="2.5"/>';}
else{
svg+='<rect x="'+ox+'" y="'+oy+'" width="'+dw+'" height="'+dh+'" fill="none" stroke="#c49a6c" stroke-width="2.5"/>';
svg+='<text x="'+(ox+dw/2)+'" y="'+(oy-16)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#c00000" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;">'+L_in+' мм</text>';
svg+='<text x="'+(ox-16)+'" y="'+(oy+dh/2)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#c00000" transform="rotate(-90 '+(ox-16)+' '+(oy+dh/2)+')" style="paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;">'+W_in+' мм</text>';
}
svg+='</svg>';
return svg;
}

function kpInit3D(kp,layout,container){
    var attempts=0;
    function tryInit(){
        attempts++;
        if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
            if(attempts < 60){setTimeout(tryInit, 100);}
            else{container.innerHTML='<div class="kp-3d-loading">Ошибка: библиотека 3D не загружена.<br>Обновите страницу.</div>';}
            return;
        }
        try{
            const canvas=document.createElement('canvas');
            canvas.style.display='block';canvas.style.width='100%';canvas.style.height='100%';
            container.innerHTML='';container.appendChild(canvas);
            const W=container.clientWidth||640,H=container.clientHeight||360;
            const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
            renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
            renderer.setSize(W,H,false);
            const scene=new THREE.Scene();
            const camera=new THREE.PerspectiveCamera(40,W/H,0.1,200);
            const Lm=layout.L_in/1000,Wm=layout.W_in/1000;
            const railHm=layout.railH/1000;
            const s=Math.max(Lm,Wm,1);
            camera.position.set(Lm*0.9,s*0.7,Wm*1.2);
            camera.lookAt(0,railHm/2,0);
            const controls=new THREE.OrbitControls(camera,canvas);
            controls.enableDamping=true;controls.dampingFactor=0.06;
            controls.autoRotate=true;controls.autoRotateSpeed=1.2;
            controls.enableZoom=true;controls.enablePan=false;
            controls.target.set(0,railHm/2,0);
            scene.add(new THREE.AmbientLight(0xffffff,0.8));
            const dl1=new THREE.DirectionalLight(0xffd7a3,1.0);dl1.position.set(5,10,5);scene.add(dl1);
            const dl2=new THREE.DirectionalLight(0xffd7a3,0.6);dl2.position.set(-6,4,-4);scene.add(dl2);
            const dl3=new THREE.DirectionalLight(0xffffff,0.5);dl3.position.set(0,-4,6);scene.add(dl3);
            const pivot=new THREE.Group();scene.add(pivot);
            const xOff=-Lm/2,zOff=-Wm/2;
            let mRailMat;
            const woodName=kp.p.color;
            if(WOOD_PROC[woodName]){const p=WOOD_PROC[woodName];mRailMat=new THREE.MeshLambertMaterial({map:makeWoodTexture(p.base,p.dark,p.opts),side:THREE.DoubleSide});}
            else if(COLORS[woodName]){mRailMat=new THREE.MeshLambertMaterial({color:parseInt(COLORS[woodName].hex.replace('#',''),16),side:THREE.DoubleSide});}
            else{mRailMat=new THREE.MeshLambertMaterial({color:0xc9a166,side:THREE.DoubleSide});}
            const mCarrier=new THREE.MeshLambertMaterial({color:0xd0c8be});
            const railWm=layout.railW/1000;
            for(const rseg of layout.perRailSegments){
                const lenM=rseg.len/1000;if(lenM<0.02)continue;
                const ux=(rseg.x1-rseg.x0)/rseg.len,uz=(rseg.y1-rseg.y0)/rseg.len;
                const railAngle=-Math.atan2(uz,ux);
                let cumM=0;
                for(let i=0;i<rseg.pieces.length;i++){
                    let piece=rseg.pieces[i];
                    const remaining=rseg.len-cumM*1000;if(piece>remaining)piece=remaining;
                    const pieceM=piece/1000;
                    const cxm=rseg.x0/1000+ux*(cumM+pieceM/2)+xOff;
                    const czm=rseg.y0/1000+uz*(cumM+pieceM/2)+zOff;
                    const grp=makeRailAsBoxes(railWm,railHm,1.5/1000,5/1000,pieceM,mRailMat);
                    grp.position.set(cxm,0,czm);grp.rotation.y=railAngle;pivot.add(grp);cumM+=pieceM;
                }
            }
            const carrierWm=CARRIER_W/1000,carrierHm=CARRIER_H/1000;
            for(const sseg of layout.perStringerSegments){
                for(const sg of sseg.segs){
                    const lenM=sg.len/1000;if(lenM<0.02)continue;
                    const cxM=(sg.x0+sg.x1)/2/1000+xOff;
                    const czM=(sg.y0+sg.y1)/2/1000+zOff;
                    const ux=(sg.x1-sg.x0)/sg.len,uz=(sg.y1-sg.y0)/sg.len;
                    const strAngle=Math.atan2(ux,uz);
                    const mesh=new THREE.Mesh(new THREE.BoxGeometry(carrierWm,carrierHm,lenM),mCarrier);
                    mesh.position.set(cxM,railHm+carrierHm/2,czM);mesh.rotation.y=strAngle;pivot.add(mesh);
                }
            }
            let t=0;
            function loop(){requestAnimationFrame(loop);t+=0.016;pivot.position.y=Math.sin(t*0.8)*0.02;controls.update();renderer.render(scene,camera);}
            loop();
        }catch(err){container.innerHTML='<div class="kp-3d-loading">Ошибка 3D: '+escapeHtml(err.message||'неизвестно')+'</div>';}
    }
    tryInit();
}

function kpRenderCuttingScheme(cuttingScheme,targetLen){
    let html='';
    for(let i=0;i<cuttingScheme.length;i++){
        const s=cuttingScheme[i];
        html+='<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(196,154,108,.1);font-size:12.5px">';
        html+='<div style="flex-shrink:0;width:32px;color:#7a8a99;font-weight:600">#'+(i+1)+'</div>';
        html+='<div style="flex:1;height:22px;background:#f0ece6;border-radius:4px;overflow:hidden;display:flex;border:1px solid rgba(196,154,108,.2)">';
        for(const item of s.items){const w=(item/targetLen)*100;html+='<span style="height:100%;background:linear-gradient(180deg,#a8c9a8,#7aa87a);border-right:1px solid rgba(0,0,0,.1);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;width:'+w+'%;flex:0 0 '+w+'%">'+item+'</span>';}
        if(s.waste>0){const w=(s.waste/targetLen)*100;html+='<span style="height:100%;background:linear-gradient(180deg,#e0b0a0,#c98a7a);width:'+w+'%;flex:0 0 '+w+'%"></span>';}
        html+='</div><div style="flex-shrink:0;color:#7a8a99;font-size:12px">'+s.items.join(' + ')+(s.waste>0?' · отход '+s.waste+' мм':'')+'</div></div>';
    }
    return html;
}

function getValidUntil(){const d=new Date();d.setDate(d.getDate()+10);const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');const yyyy=d.getFullYear();return dd+'.'+mm+'.'+yyyy;}

function renderKp(kp){
    const layout=recalcLayout(kp);
    const rowsHtml=kp.rows.map(r=>'<tr><td>'+escapeHtml(r.label)+'</td><td class="qty">'+r.qty+' шт.</td></tr>').join('');
    let mergeBlock='';
    if(kp.mergeInfo){
        mergeBlock='<div class="kp-section kp-observable"><h2 class="kp-sec-title"><span class="kp-sec-num">4</span>Схема нарезки</h2>';
        mergeBlock+='<div style="text-align:center;font-size:14px;color:#7a8a99;margin-bottom:16px">Объединено в <b style="color:#c49a6c">'+kp.mergeInfo.refSize+' мм</b> · итого '+kp.mergeInfo.totalQty+' шт · отход '+Math.round(kp.mergeInfo.waste)+' мм</div>';
        mergeBlock+=kpRenderCuttingScheme(kp.mergeInfo.cuttingScheme,kp.mergeInfo.refSize);
        mergeBlock+='</div>';
    }
    const validUntil=getValidUntil();
    const headerLogo='<div class="kp-logo-svg"><svg viewBox="0 0 316.2 113.2335483871" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><g transform="scale(4.541935483871) translate(0, 0)"><g><polygon fill="#e10004" points="5.1,16.3 15,6.4 13.7,5.2 2.7,16.3"/><polygon fill="#e10004" points="13.1,16.3 15.5,16.3 14.3,15"/><polygon fill="#e10004" points="12.6,13.3 9.6,16.3 12.1,16.3 13.8,14.5"/><polygon fill="#e10004" points="6.1,16.3 8.6,16.3 12.1,12.8 10.8,11.6"/><polygon fill="#e10004" points="0,16.3 1.7,16.3 13.2,4.7 12,3.5 0,15.5"/><polygon fill="#e10004" points="0,7.5 6.3,1.2 5.1,0 0,5.1"/><polygon fill="#e10004" points="0,4.1 2.8,1.2 1.6,0 0,1.6"/><polygon fill="#e10004" points="0,11 9.8,1.2 8.5,0 0,8.5"/><polygon fill="#e10004" points="0,14.5 11.5,3 10.3,1.7 0,12"/><polygon fill="rgba(225,0,4,0.3)" points="5.1,16.3 15,6.4 13.7,5.2 2.7,16.3"/><polygon fill="rgba(225,0,4,0.3)" points="0,16.3 1.7,16.3 13.2,4.7 12,3.5 0,15.5"/><polygon fill="rgba(225,0,4,0.3)" points="0,11 9.8,1.2 8.5,0 0,8.5"/><polygon fill="rgba(225,0,4,0.3)" points="0,14.5 11.5,3 10.3,1.7 0,12"/><polygon fill="rgba(225,0,4,0.6)" points="13.1,16.3 15.5,16.3 14.3,15"/><polygon fill="rgba(225,0,4,0.6)" points="12.6,13.3 9.6,16.3 12.1,16.3 13.8,14.5"/><polygon fill="rgba(225,0,4,0.6)" points="6.1,16.3 8.6,16.3 12.1,12.8 10.8,11.6"/></g></g></svg></div>';
    const html=
    '<div class="kp-hero">'+headerLogo+
    '<h1 class="kp-h1">Коммерческое предложение</h1>'+
    '<p class="kp-h2">Потолок CUBICA · '+escapeHtml(kp.railSpec)+' · '+escapeHtml(kp.color)+'</p>'+
    '<p class="kp-client">Для: <b style="color:#2c3e50">'+escapeHtml(kp.manager)+'</b></p></div>'+
    '<div class="kp-section kp-observable"><h2 class="kp-sec-title"><span class="kp-sec-num">1</span>Параметры помещения</h2><div class="kp-grid">'+
    '<div class="kp-stat"><div class="kp-stat-lb">Площадь</div><div class="kp-stat-vl"><span data-count="'+kp.area.toFixed(2)+'">0</span><small> м²</small></div></div>'+
    '<div class="kp-stat"><div class="kp-stat-lb">Цвет</div><div class="kp-stat-vl" style="font-size:16px">'+escapeHtml(kp.color)+'</div></div>'+
    '<div class="kp-stat"><div class="kp-stat-lb">Рейка</div><div class="kp-stat-vl" style="font-size:18px">'+kp.railSpec+'</div></div>'+
    '<div class="kp-stat"><div class="kp-stat-lb">Шаг</div><div class="kp-stat-vl"><span data-count="'+layout.pitch+'">0</span><small> мм</small></div></div>'+
    '</div></div>'+
    '<div class="kp-section kp-observable"><h2 class="kp-sec-title"><span class="kp-sec-num">2</span>3D-объём потолка</h2><div class="kp-3d" id="kp-3d-container"></div><div style="text-align:center;font-size:12px;color:#7a8a99;margin-top:10px">Потолок вращается автоматически · потяните мышью, чтобы посмотреть</div></div>'+
    '<div class="kp-section kp-observable"><h2 class="kp-sec-title"><span class="kp-sec-num">3</span>2D-схема укладки</h2><div class="kp-scheme-2d">'+kpBuild2DScheme(kp,layout)+'</div></div>'+
    mergeBlock+
    '<div class="kp-section kp-observable"><h2 class="kp-sec-title"><span class="kp-sec-num">'+(kp.mergeInfo?'5':'4')+'</span>Спецификация</h2><table class="kp-table"><thead><tr><th>Позиция</th><th style="text-align:right">Кол-во</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="kp-section kp-observable"><div class="kp-total"><div class="kp-total-lb">Итоговая стоимость с НДС</div><div class="kp-total-vl"><span data-count="'+kp.price+'" data-decimals="2">0</span><small>BYN</small></div><div style="margin-top:12px;font-size:13px;color:#7a8a99">Цена включает материалы, доставку, раскладку</div></div><div style="text-align:center"><span class="kp-valid">Предложение действительно до '+validUntil+'</span></div></div>'+
    '<div class="kp-actions"><a class="kp-btn secondary" href="tel:+375447527073">📞 Позвонить</a><button class="kp-btn danger" onclick="window.print()">📄 Распечатать счёт PDF</button></div>'+
    '<div class="kp-contacts">E-mail: <a href="mailto:7527073@armstrong.by">7527073@armstrong.by</a></div>'+
    '<div class="kp-actions" style="margin-top:8px"><a class="kp-btn montage" href="tel:+375336374064">📞 Позвонить монтажнику</a></div>'+
    '<div class="kp-montage-note">Если Вас интересуют услуги монтажа, профессиональный монтаж рейки — <b>Сергей</b>. Нажмите кнопку, чтобы позвонить.</div>'+
    '<div class="kp-foot">© CUBICA.BY · Кубическая рейка · '+escapeHtml(kp.manager)+' · '+escapeHtml(kp.phone)+'</div>';
    document.getElementById('kp-content').innerHTML=html;
    setTimeout(function(){
        var obs=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting)en.target.classList.add('visible');});},{threshold:0.1});
        document.querySelectorAll('.kp-observable').forEach(function(el){obs.observe(el);});
        document.querySelectorAll('[data-count]').forEach(function(el,idx){
            var target=parseFloat(el.getAttribute('data-count'));
            var dec=parseInt(el.getAttribute('data-decimals')||'0',10);
            var dur=1600;var delay=400+idx*80;
            setTimeout(function(){
                var start=performance.now();
                function tick(now){var t=Math.min(1,(now-start)/dur);var eased=1-Math.pow(1-t,3);var val=target*eased;if(dec>0)el.textContent=val.toFixed(2);else el.textContent=Math.round(val).toLocaleString('ru-RU');if(t<1)requestAnimationFrame(tick);}
                requestAnimationFrame(tick);
            },delay);
        });
        var c3d=document.getElementById('kp-3d-container');
        if(c3d)setTimeout(function(){try{kpInit3D(kp,layout,c3d);}catch(e){}},300);
    },350);
}

function init(){
    var payload=null;
    try{var sp=new URLSearchParams(window.location.search);if(sp.has('kp'))payload=sp.get('kp');}catch(e){}
    if(!payload){payload=TEST_PAYLOAD;}
    if(!payload){document.getElementById('kp-content').innerHTML='<div class="kp-empty"><h2>Нет данных для КП</h2></div>';return;}
    var kp;
    try{kp=JSON.parse(b64dec(payload));}catch(e){document.getElementById('kp-content').innerHTML='<div class="kp-empty"><h2>Ошибка чтения КП</h2></div>';return;}
    if(!kp||kp.v!==1){document.getElementById('kp-content').innerHTML='<div class="kp-empty"><h2>Неверный формат КП</h2></div>';return;}
    renderKp(kp);
}
init();
</script>
